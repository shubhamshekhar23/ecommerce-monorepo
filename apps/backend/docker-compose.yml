version: '3.8'
name: ecommerce-monorepo-backend

# ─── Development Stack ────────────────────────────────────────────────────────
# Topology:
#   Browser → Nginx (:80) → NestJS App (:3000)
#                  ↓
#             App → PgBouncer (:6432) → PostgreSQL (:5432)
#             App → Redis (:6379)
#
# Why PgBouncer in dev?
#   Same as production. You learn to watch real connection pool behaviour
#   with `docker exec -it ecommerce_pgbouncer psql -p 6432 pgbouncer -U ecommerce_user -c "SHOW POOLS"`.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    # Phase 10: shared_preload_libraries must be set at startup (not via SQL).
    # pg_stat_statements tracks execution stats for all queries — required for
    # GET /api/admin/db/slow-queries to return data.
    # wal_level=replica enables streaming replication (used with docker-compose.replica.yml).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - '5434:5432' # exposed for direct access (psql, Prisma Studio, migrations)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce_user']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── PgBouncer ───────────────────────────────────────────────────────────────
  # The NestJS app connects HERE (port 6432), not directly to PostgreSQL.
  # PgBouncer multiplexes many app connections into a small pool of real DB connections.
  #
  # Try this while load testing to see pooling in action:
  #   docker exec ecommerce_postgres psql -U ecommerce_user -c "SELECT count(*) FROM pg_stat_activity"
  # You will see ~20 connections regardless of how many app requests are in flight.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce_pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_db
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_password
      # TRANSACTION mode: connection returned to pool after each transaction.
      # Required for Prisma — disables prepared statements which are session-scoped
      # and break under transaction pooling. Prisma URLs must include ?pgbouncer=true.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      # Prisma sends this startup parameter; PgBouncer must be told to ignore it
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: plain
      LISTEN_PORT: 6432
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── Nginx ───────────────────────────────────────────────────────────────────
  # Reverse proxy: terminates HTTP, injects X-Request-ID, applies rate limits.
  # Access the app via http://localhost (port 80) to go through Nginx.
  # You can also hit http://localhost:4000 directly (bypassing Nginx) for debugging.
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - ecommerce-network

  # ── NestJS Application ──────────────────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: deps        # use the deps stage so devDeps (@nestjs/cli) are present
    container_name: ecommerce_app
    environment:
      - NODE_ENV=development
      # Connects to PgBouncer, not Postgres directly.
      # ?pgbouncer=true  → disables Prisma prepared statements (session-scoped, break in transaction mode)
      # &connection_limit=1 → Prisma opens 1 connection to PgBouncer per instance (PgBouncer handles the pooling)
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@pgbouncer:6432/ecommerce_db?pgbouncer=true&connection_limit=1
      # DIRECT_DATABASE_URL bypasses PgBouncer for Prisma migrations (which use advisory locks — session-scoped)
      - DIRECT_DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - JWT_SECRET=dev-secret-key-min-32-chars-do-not-use-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-min-32-chars-do-not-use-in-production
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://localhost:3001,http://localhost:3002
      # RS256 JWT keys (DEV ONLY — generate fresh keys for production)
      - JWT_PRIVATE_KEY=-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCZievmfoHsQ9Gl\nb65A1Tbd/yefHbbac0y6mVWIFN/3sGGpuNUFlyV092ARBfVu1uuXzmYDzyw2CXT6\nnpJerkIychpN0WohxrnAV4oBI75YI19da302uKGOzY4vy4tmLHEhAVnsWZ9CNtpS\nrEgZAlT0XuR3e42RWLsSWzTSSvtO/u+NAFLB/QHhaIjunZBxb6YV8r/kh+rCOtHn\nvqr8qlWvIim5gXzg4lsnQcy671WGOPo4VWqfDE5990kv2V43NS1kRKVUknaaV7I+\n8+ns+0qywgszWnwAGs8CuPebpiUuuC2OaUgTfVeRJB0AoN088H2S0i24SyUAvQ05\nZOtknVC3AgMBAAECggEARhN4aw1vT/3OGCNGVUnbDmxv0YQW2lJIgVwNeRwJ8rr6\ngCOfejs3edCT9IETOUD3ayRlVDTAuXMMhHxOUs9W4D5Kuhyrw3m3es2Za5a8P+75\nDiLKleijuBEiZbcRSxNamNVMjP6EnQx7DcOa7mstihErVks6XE2yqBifnaFiXPVy\nA/rJPXRX//qamRprXylKsolcLvA1sYgrpxWx6yY3ZAg9CLNpWFeJMv8Vc0dgxJci\n37YxPsySUHOAffmj4q14UPX9SVTBG9wUU38ciQN88bT5JX6kvDC7S2JlUpvo+9bc\n2qdi5n4XUldoKFCVJ5P44Oziajg7HZ6wafu0DofroQKBgQDP1/UEfntXK/ttX6k4\nOQ7g/y6MzEAGVflaTv5z6WygQigz3JKXIvEO7INVG2uLU1VMYeVLpqgCOURzVn14\nN41cAolbIWBkBUPLxpZFojPhmqKiZNhL+BNv/uRf1RwIl1Q753gfz4X7azH/AMu1\n+Q4bmickRbgFCiIApZ3kktgbIQKBgQC9HOz2suQ18gu12LHvPFbX153NzS4hO9qV\nOFOvCbBCu/rExGnPpDvN3JsS32bchvpurk98yzZtX2ygIZ4xw9qLbt3M2kAMnJuQ\npfqyG96Bl2x59VYazIeia93uy30X4cu19/1esvibWGnsq4mABCs6vESYqWQjwHLZ\nZCTG6RWI1wKBgA1r3J6VrFFMvceqTbsbtCJDWDYvWlMOajOytiu1/xW6L+5pZ+3q\ni7Zy/2gXhTJSB0gPakcgU+kQ2aK5CxEgRTiT0VrZJOhQjrgx8rI8by06VxY1fOIq\n+tZYl1a45D6Jxx63K8KiG/zIR0o4Ou9dTdPqeGyXM/LfXKK+Dxwbf2kBAoGBAKDU\nE7ZuRuSV112sTw6tGxHu/fZDE4MR+v/CanDG5Y6rfUWP4IjFHFMj1QIE2d6cMCim\nt1TjIYN8js3UKUwbSyYfgCOyTJwtJ6OpdH26c810ML27ZqHd5U+9On3Vsqn3zh4Q\nK/s4a3L5iwPKkmI7qWQHLrNCA7bf+QxmPVyoZzb7AoGBAKh4z8xAfjZ1xCtu1u97\n6wg478e10p55/hmIm2dJXbg7IJ7Hp1gjWMjEbcMhWHbYeLF1M2GhE7Oy86/+QkHP\nOddgCB6MxPDUVjPWAG4TtXXG+RKxZTWZXgwcHGFly6kc06KOAPUvb8q7H8hbFjEZ\ni3u+IOX15ZZqRk/JXsIrAhve\n-----END PRIVATE KEY-----
      - JWT_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmYnr5n6B7EPRpW+uQNU2\n3f8nnx222nNMuplViBTf97BhqbjVBZcldPdgEQX1btbrl85mA88sNgl0+p6SXq5C\nMnIaTdFqIca5wFeKASO+WCNfXWt9Nrihjs2OL8uLZixxIQFZ7FmfQjbaUqxIGQJU\n9F7kd3uNkVi7Els00kr7Tv7vjQBSwf0B4WiI7p2QcW+mFfK/5IfqwjrR576q/KpV\nryIpuYF84OJbJ0HMuu9Vhjj6OFVqnwxOffdJL9leNzUtZESlVJJ2mleyPvPp7PtK\nssILM1p8ABrPArj3m6YlLrgtjmlIE31XkSQdAKDdPPB9ktItuEslAL0NOWTrZJ1Q\ntwIDAQAB\n-----END PUBLIC KEY-----
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    ports:
      - '4000:4000' # direct access (bypasses Nginx) — useful for debugging
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ../..:/app                                    # mount monorepo root so source code is live-reloaded
      - node_modules:/app/node_modules                # named volume — see "volumes:" at bottom of file
      - backend_node_modules:/app/apps/backend/node_modules
    working_dir: /app/apps/backend
    command: npm run start:dev
    networks:
      - ecommerce-network

  # ── PgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── Jaeger ──────────────────────────────────────────────────────────────────
  # Distributed tracing backend. The NestJS app sends OTLP spans here via
  # OpenTelemetry SDK (src/tracing.ts). Open http://localhost:16686 to see
  # request waterfalls: HTTP handler → service → Prisma queries → Redis calls.
  # This is how senior devs find slow code: click a trace, see which span is fat.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686'  # Jaeger UI
      - '4318:4318'    # OTLP HTTP receiver (app sends traces here)
    networks:
      - ecommerce-network

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - ecommerce-network
    depends_on:
      - app

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - ecommerce-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  # node_modules volumes — named so "docker compose down -v" removes them predictably.
  # Rule: whenever package.json changes, run the rebuild script (see below) instead of
  # plain "docker compose up --build", which leaves these stale.
  node_modules:
  backend_node_modules:

networks:
  ecommerce-network:
    driver: bridge
