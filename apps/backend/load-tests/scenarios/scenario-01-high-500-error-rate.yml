config:
  target: 'http://localhost:3000'
  phases:
    - duration: 30
      arrivalRate: 5
      name: 'Warm-up'
    - duration: 180
      arrivalRate: 20
      name: 'Sustained — observe 5xx flood'
  defaults:
    headers:
      Content-Type: 'application/json'
  variables:
    apiPrefix: '/api'

scenarios:
  - name: 'S1 - Product listing (all 500s)'
    flow:
      - get:
          url: '{{ apiPrefix }}/products?page=1&limit=20'
      - think: 1
      - get:
          url: '{{ apiPrefix }}/products?page=2&limit=20'
      - think: 2
      - get:
          url: '{{ apiPrefix }}/products?page=1&limit=10&text=shirt'
      - think: 1
