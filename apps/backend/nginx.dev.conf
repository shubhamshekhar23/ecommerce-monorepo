# ─── Nginx Development Config ────────────────────────────────────────────────
# HTTP only (no SSL). Intentionally mirrors nginx.conf structure so behaviour
# is consistent between dev and prod. Issues like missing CORS headers or
# incorrect rate limits surface here, not in production.
#
# WHY NGINX IN DEV?
#   You could hit the NestJS app directly on port 3000. But running through
#   Nginx in dev teaches you: upstream keepalive, rate limiting, request ID
#   injection, and header forwarding — all of which matter in production.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  # epoll is Linux's most efficient I/O event mechanism (used automatically
  # by Nginx on Linux; this makes it explicit and educational)
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Structured log format — $request_id ties each Nginx log line to the
  # correlation ID propagated through the NestJS app
  log_format main '$remote_addr [$time_local] "$request" $status '
    '$body_bytes_sent rt=$request_time req_id=$request_id';

  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  # Gzip: compress JSON/JS responses before sending to the client
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/plain text/css text/xml;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # $binary_remote_addr: 4 bytes vs $remote_addr string — uses less shared memory.
  # zone=api_limit:10m — 10MB shared memory, holds ~160K IP states.
  #
  # These limits are relaxed vs prod so they don't block local development,
  # but the zones exist so you can test rate-limiting behaviour.
  limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ── Upstream: the NestJS app ───────────────────────────────────────────────
  # least_conn: route to the backend with fewest active connections.
  # keepalive 32: maintain 32 idle keepalive connections to the upstream —
  # avoids TCP handshake overhead on every request.
  upstream backend {
    least_conn;
    server app:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # ── Security headers (same as prod) ──────────────────────────────────────
    # Adding these in dev catches issues before they reach production.
    add_header X-Frame-Options    "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff" always;
    # Inject Nginx-generated request ID into the response so browser devtools
    # can correlate a request with its server-side trace
    add_header X-Request-ID $request_id always;

    # ── Health + metrics: no rate limit, suppress access logs ─────────────────
    location ~ ^/api/(health|metrics) {
      access_log off;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── Auth endpoints: stricter rate limit ───────────────────────────────────
    # burst=20: up to 20 requests can queue before being rejected.
    # nodelay: reject excess requests immediately rather than queuing them.
    location ~ ^/api/auth/(login|register) {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection         "";
      proxy_set_header   Host               $host;
      proxy_set_header   X-Real-IP          $remote_addr;
      proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto  $scheme;
      # X-Request-ID: injected by Nginx, read by NestJS middleware to set
      # the correlation ID for all log lines within this request's lifecycle
      proxy_set_header   X-Request-ID       $request_id;
    }

    # ── Stripe webhook: no rate limit, no request buffering ──────────────────
    # proxy_request_buffering off: stream the body directly to NestJS.
    # Stripe sends a raw JSON body with a signature header; buffering can
    # alter the body and break signature verification.
    location /api/stripe/webhook {
      proxy_pass                 http://backend;
      proxy_http_version         1.1;
      proxy_set_header           Connection        "";
      proxy_set_header           Host              $host;
      proxy_set_header           X-Real-IP         $remote_addr;
      proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header           X-Request-ID      $request_id;
      proxy_request_buffering    off;
      client_max_body_size       5M;
    }

    # ── All other API endpoints ────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection         "";
      proxy_set_header   Host               $host;
      proxy_set_header   X-Real-IP          $remote_addr;
      proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto  $scheme;
      proxy_set_header   X-Request-ID       $request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\. {
      deny all;
      access_log off;
    }
  }
}
