; ─── PgBouncer Configuration ───────────────────────────────────────────────
; This file is the reference config. In docker-compose it is mounted at
; /etc/pgbouncer/pgbouncer.ini inside the pgbouncer container.
;
; WHAT IS PGBOUNCER?
;   PostgreSQL spawns a new OS process per connection. At high load (100 Node.js
;   instances × 5 Prisma pool connections = 500 Postgres processes), the server
;   degrades. PgBouncer sits in front of Postgres and multiplexes: 500 app
;   connections share ~20 real Postgres server connections.
;
; CONNECTION FLOW:
;   App → PgBouncer (port 6432) → PostgreSQL (port 5432)

[databases]
; Map the database name clients use to the real Postgres server.
; Clients connect as:  postgresql://user:pass@pgbouncer:6432/ecommerce_db
; PgBouncer routes to: postgresql://user:pass@postgres:5432/ecommerce_db
ecommerce_db = host=postgres port=5432 dbname=ecommerce_db

[pgbouncer]
; ── Network ──────────────────────────────────────────────────────────────────
listen_port = 6432
listen_addr = *          ; accept connections from any interface inside Docker

; ── Pool mode ────────────────────────────────────────────────────────────────
; SESSION mode (default):
;   One server connection held for the entire client session. Simple but wastes
;   connections (connection is held even when the client is idle between queries).
;
; TRANSACTION mode (required for Prisma/ORMs):
;   Server connection returned to the pool after EACH transaction. Enables
;   highest connection multiplexing. Prisma must use ?pgbouncer=true in the URL
;   to disable prepared statements, which are session-scoped and break here.
;
; STATEMENT mode: one server connection per SQL statement. Too restrictive.
pool_mode = transaction

; ── Pool sizing ──────────────────────────────────────────────────────────────
; max_client_conn: how many simultaneous client connections PgBouncer accepts.
; Should be ≥ sum of all app instances × their Prisma connection_limit.
max_client_conn = 200

; default_pool_size: server connections per (database, user) pair.
; These are actual Postgres connections. Keep this well below Postgres
; max_connections (default: 100). Rule of thumb: (max_connections × 0.8) / num_apps
default_pool_size = 20

; min_pool_size: keep this many server connections open even when idle.
; Reduces cold-start latency for the first queries after a quiet period.
min_pool_size = 5

; reserve_pool_size: extra connections available temporarily during traffic spikes.
reserve_pool_size = 5
reserve_pool_timeout = 3  ; seconds to wait before using reserve connections

; ── Authentication ───────────────────────────────────────────────────────────
; plain: password sent in cleartext — acceptable on a private Docker network.
; md5:   MD5-hashed password — use in production or any non-private network.
; scram-sha-256: strongest — use when Postgres is also configured for SCRAM.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; ── Logging ──────────────────────────────────────────────────────────────────
; Suppress connect/disconnect logs in dev (very noisy with connection pooling).
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1     ; always log pool errors

; ── Compatibility ────────────────────────────────────────────────────────────
; Prisma sends extra_float_digits=3 on startup. PgBouncer doesn't know this
; parameter and will reject the connection without this setting.
ignore_startup_parameters = extra_float_digits

; Clean up any session state between clients. Ensures one client's SET commands
; (e.g., SET search_path) don't leak into the next client's connection.
server_reset_query = DISCARD ALL
