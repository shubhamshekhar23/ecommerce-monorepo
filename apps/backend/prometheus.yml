global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ecommerce-backend'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # "app" resolves via Docker Compose DNS. Port 4000 is the NestJS app.
  - job_name: 'ecommerce-backend'
    static_configs:
      - targets: ['backend:4000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PgBouncer pool stats: client_active, client_waiting, server_idle, total_requests.
  # Use these to alert when pool is saturated (client_waiting > 0 sustained).
  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['pgbouncer-exporter:9127']
    scrape_interval: 15s
