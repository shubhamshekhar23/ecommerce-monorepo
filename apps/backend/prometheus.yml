global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ecommerce-backend'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # "app" resolves via Docker Compose DNS. Port 4000 is the NestJS app.
  - job_name: 'ecommerce-backend'
    static_configs:
      - targets: ['app:4000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
