# ── Production Stack ─────────────────────────────────────────────────────────
# Blue-green topology:
#
#   Browser → Nginx (:80/:443)
#                  ↓ (active upstream: conf.d/upstream.conf)
#             app-blue:3000  ← one of these is live at any time
#             app-green:3000 ← the other is idle (stopped between deploys)
#                  ↓
#             PgBouncer:6432 → PostgreSQL:5432
#
# Managing traffic:
#   blue-green-deploy.sh handles the switch. Never `docker compose restart app-blue`
#   directly — that creates downtime. Always use the deploy script.
#
# First deploy on a new server:
#   1. Copy .env.prod → .env  (fill in all secrets)
#   2. echo blue > .active-color
#   3. IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.prod.yml up -d app-blue nginx postgres redis pgbouncer
#   4. docker compose -f docker-compose.prod.yml exec app-blue npx prisma migrate deploy

# YAML anchor for shared app configuration.
# Both app-blue and app-green are identical except for their container names.
# This avoids repeating 30+ lines of config. DRY principle in infrastructure.
x-app: &app-defaults
  image: "${REGISTRY:-ghcr.io}/${IMAGE_NAME?IMAGE_NAME required}/backend:${APP_IMAGE:-latest}"
  environment:
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: >-
      postgresql://${DB_USER:-ecommerce_user}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME:-ecommerce_db}?pgbouncer=true&connection_limit=1
    DIRECT_DATABASE_URL: >-
      postgresql://${DB_USER:-ecommerce_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-ecommerce_db}
    REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    # RS256 JWT keys. Generate with:
    #   openssl genrsa -out private.pem 2048
    #   openssl rsa -in private.pem -pubout -out public.pem
    # Store as single-line in .env (replace newlines with \n):
    #   JWT_PRIVATE_KEY=$(awk 'NF {sub(/\r/, ""); printf "%s\\n",$0;}' private.pem)
    JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
    JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    JWT_EXPIRATION: 15m
    JWT_REFRESH_EXPIRATION: 7d
    CORS_ORIGIN: "${CORS_ORIGIN}"
    LOG_LEVEL: info
    STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
    STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
    SMTP_HOST: "${SMTP_HOST}"
    SMTP_PORT: "${SMTP_PORT}"
    SMTP_USER: "${SMTP_USER}"
    SMTP_PASSWORD: "${SMTP_PASSWORD}"
    SMTP_FROM: "${SMTP_FROM}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  networks:
    - ecommerce_network
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ecommerce_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ── PgBouncer ────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce_pgbouncer_prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ── App: Blue slot ────────────────────────────────────────────────────────────
  # The "current live" slot. Only one of blue/green runs at a time.
  # blue-green-deploy.sh manages which is active.
  # Do NOT start both simultaneously — they would both serve traffic and the
  # deploy script would not be able to do a clean switch.
  app-blue:
    <<: *app-defaults
    container_name: ecommerce_app_blue

  # ── App: Green slot ───────────────────────────────────────────────────────────
  app-green:
    <<: *app-defaults
    container_name: ecommerce_app_green

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx_prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Blue-green upstream switching: deploy script writes to conf.d/upstream.conf
      # then signals nginx to reload. Mount as read-write (no :ro).
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app-blue
    networks:
      - ecommerce_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus_prod
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - ecommerce_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ecommerce_network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ── Backup ────────────────────────────────────────────────────────────────────
  # Triggered via profile — not started by default.
  # Run a one-shot backup:
  #   docker compose -f docker-compose.prod.yml --profile backup run --rm backup
  # Or schedule via host cron:
  #   0 2 * * * docker compose -f /app/docker-compose.prod.yml --profile backup run --rm backup
  #
  # Why host cron instead of container cron?
  #   A container cron failure is silent unless you monitor it separately.
  #   Host cron failure is visible in crontab logs and easier to alert on.
  backup:
    image: postgres:16-alpine
    container_name: ecommerce_backup
    profiles:
      - backup
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      BACKUP_DIR: /backups
      KEEP_DAYS: "7"
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network
    entrypoint: []
    command: sh /usr/local/bin/backup.sh

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  backup_data:
    driver: local
