apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-service-ingress
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Ingress
  ingress:
    # notification-service has no HTTP callers — it is a pure RabbitMQ consumer.
    # Allow only Prometheus to scrape its /metrics health endpoint.
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 3004
