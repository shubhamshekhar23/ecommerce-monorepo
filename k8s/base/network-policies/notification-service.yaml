apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-service-ingress
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Ingress
  ingress:
    # notification-service is a RabbitMQ consumer with a health HTTP endpoint.
    # Gateway polls /health for the aggregated health check.
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 3004
