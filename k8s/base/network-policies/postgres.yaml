apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # pgbouncer is the primary entry point; backend and auth-service use DIRECT_DATABASE_URL
    - from:
        - podSelector:
            matchLabels:
              app: pgbouncer
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - port: 5432
