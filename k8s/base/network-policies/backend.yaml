apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 4000
    # Prometheus scrapes /metrics on the same port
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 4000
