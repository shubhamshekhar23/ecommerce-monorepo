apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus-deployment.yaml
  - grafana-deployment.yaml
  - loki-statefulset.yaml
  - promtail-daemonset.yaml

# ConfigMapGenerator loads the actual config files from disk — no content duplication.
# Kustomize appends a hash suffix to the ConfigMap name and updates all references automatically.
# When you change prometheus.yml, kustomize detects it and triggers a rolling restart of Prometheus.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus.yml
      - alert_rules.yml=alert_rules.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=grafana-ds-prometheus.yml
      - loki.yml=grafana-ds-loki.yml
  - name: grafana-dashboards-config
    files:
      - dashboards.yml=grafana-dashboards-config.yml
  - name: grafana-dashboards
    files:
      - api-metrics.json=api-metrics.json
      - business.json=business.json
      - database.json=database.json
      - infrastructure.json=infrastructure.json
