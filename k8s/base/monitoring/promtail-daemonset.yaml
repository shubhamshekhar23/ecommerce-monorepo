# Promtail runs as a DaemonSet — one Pod per node — so every node's logs are collected.
# It reads /var/log/pods/ from the host filesystem and ships log lines to Loki.
# The ClusterRole gives it read access to pod/node metadata for labeling log streams.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, services, pods, endpoints]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ecommerce
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.ecommerce.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # cri parses the containerd/CRI log format:
          # <timestamp> <stream> <flags> <log>
          # This is what kind (containerd) and most managed K8s use.
          - cri: {}
        relabel_configs:
          # Only collect logs from the ecommerce namespace.
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: ecommerce
          # Build the host path to the log file from pod UID + container name.
          # Actual path: /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            regex: (.+)
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
          # Attach useful labels to every log stream.
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container
          # app label (e.g. backend, gateway) — set by Deployment selector.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        # Run on control-plane nodes too so their logs are collected.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - -config.file=/etc/promtail/config.yml
          ports:
            - containerPort: 9080
              name: http-metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        # positions.yaml tracks how far through each log file Promtail has read.
        # hostPath persists it on the node so a pod restart doesn't re-ship old logs.
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
