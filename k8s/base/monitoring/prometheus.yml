global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ecommerce-backend'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # In K8s, "backend" resolves via CoreDNS to the backend Service ClusterIP.
  # Docker Compose used "app:4000" — only the hostname differs.
  - job_name: 'ecommerce-backend'
    static_configs:
      - targets: ['backend:4000']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PgBouncer exporter runs as a sidecar in the pgbouncer Pod.
  # Port 9127 is exposed via the pgbouncer Service.
  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['pgbouncer:9127']
    scrape_interval: 15s
