# Credentials for KEDA to query the RabbitMQ Management HTTP API (port 15672).
# Replace the host value during cluster bootstrap — do not commit real credentials.
# Format: http://<user>:<password>@rabbitmq.ecommerce.svc.cluster.local:15672/
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
type: Opaque
stringData:
  host: "http://guest:guest@rabbitmq.ecommerce.svc.cluster.local:15672/"
---
# TriggerAuthentication lets KEDA read the RabbitMQ connection string from the
# Secret above without embedding credentials in the ScaledObject manifest.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: keda-rabbitmq-secret
      key: host
