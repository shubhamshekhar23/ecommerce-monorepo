apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Auth service connects DIRECTLY to postgres (not pgbouncer) — it uses
        # session-level features (advisory locks) incompatible with transaction pooling.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done']
      containers:
        - name: auth-service
          image: ghcr.io/shubhamshekhar23/ecommerce-monorepo/auth-service:latest
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "3006"
            # Direct postgres connection — bypasses pgbouncer.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DATABASE_URL
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DIRECT_DATABASE_URL
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_PUBLIC_KEY
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # TODO: add GET /health/ready to auth-service that checks postgres connectivity.
          # Until then, readiness falls back to the same liveness endpoint.
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 5']
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
