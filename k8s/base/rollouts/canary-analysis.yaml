# AnalysisTemplate queried by Argo Rollouts at each canary step.
# If success-rate drops below 99% or p99 latency exceeds 500 ms for 3 consecutive
# intervals, Argo automatically aborts the rollout and resets traffic to 0% canary.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{app="backend",status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{app="backend"}[2m]))

    - name: p99-latency
      interval: 1m
      successCondition: result[0] <= 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{app="backend"}[2m])) by (le)
            ) * 1000
