apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: search-service
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done']
        - name: wait-for-opensearch
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z opensearch 9200; do echo waiting for opensearch; sleep 2; done']
      containers:
        - name: search-service
          image: ghcr.io/shubhamshekhar23/ecommerce-monorepo/search-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "3005"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: search-secrets
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # TODO: add GET /health/ready that checks opensearch connectivity.
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 5']
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
