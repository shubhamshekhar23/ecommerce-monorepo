apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - namespace.yaml
  - network-policies/
  - pdb/
  - infra/
  - frontend/
  - backend/
  - auth-service/
  - gateway/
  - search-service/
  - notification-service/
  - analytics-service/
  - ingress/
  - jobs/
  # The following directories are NOT in base — they require cluster operators
  # or have config file references that must be resolved per-overlay:
  #   monitoring/   — configMapGenerator references ../../../apps/backend/* files
  #                   (kustomize security restriction). Fix: copy files locally, then
  #                   add "- ../../base/monitoring" to overlays that want it.
  #   service-mesh/ — requires Istio
  #   keda/         — requires KEDA operator
  #   rollouts/     — requires Argo Rollouts operator
  # Add these explicitly in overlays that target clusters with those tools installed.
