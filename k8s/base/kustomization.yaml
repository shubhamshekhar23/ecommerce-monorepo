apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - namespace.yaml
  - network-policies/
  - pdb/
  - infra/
  - frontend/
  - backend/
  - auth-service/
  - gateway/
  - search-service/
  - notification-service/
  - analytics-service/
  - ingress/
  - jobs/
  - monitoring/
  # The following directories require cluster operators and are NOT in base:
  #   service-mesh/ — requires Istio
  #   keda/         — requires KEDA operator
  #   rollouts/     — requires Argo Rollouts operator
