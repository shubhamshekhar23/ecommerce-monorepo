# Prisma migration as a Kubernetes Job — runs once to completion, not a long-running server.
#
# WHY a Job and not an initContainer on the Deployment:
# With 3 replicas starting simultaneously, 3 migration processes would race to apply
# the same migration. Prisma's advisory locking handles this, but it's fragile at scale.
# A Job runs once, blocks CI until it succeeds, THEN the Deployment rollout proceeds.
#
# HOW CI uses this:
#   kubectl create job prisma-migrate-${GITHUB_SHA::8} \
#     --from=job/prisma-migrate \
#     -n ecommerce
#   kubectl wait job/prisma-migrate-${GITHUB_SHA::8} \
#     --for=condition=complete --timeout=120s -n ecommerce
#
# DIRECT_DATABASE_URL bypasses PgBouncer — required because migrations use advisory locks
# (session-scoped, incompatible with PgBouncer transaction mode).
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: ecommerce
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: migrate
          image: ghcr.io/shubhamshekhar23/ecommerce-monorepo/backend:latest
          command: ['npx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DIRECT_DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
