# Jaeger all-in-one for local distributed tracing.
# Not included in base — in production, use a managed tracing service
# (Honeycomb, Datadog, AWS X-Ray) and update OTEL_EXPORTER_OTLP_ENDPOINT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686  # Jaeger UI
            - containerPort: 4318   # OTLP HTTP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ecommerce
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-http
      port: 4318
      targetPort: 4318
