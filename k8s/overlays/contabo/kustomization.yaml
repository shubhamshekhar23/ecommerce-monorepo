apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

# Contabo single-node VPS overlay (8 GB RAM, k3s).
# Differences from production:
#   - No managed cloud services — postgres/redis/rabbitmq/opensearch run as StatefulSets on the VPS
#   - All app replicas scaled to 1 (single node)
#   - analytics-service scaled to 0 (needs Redpanda + ClickHouse, not in base infra)
#   - Ingress uses Traefik (k3s default) instead of nginx, no TLS for now
#   - No service-mesh/keda/rollouts/monitoring — those are in production overlay only
resources:
  - ../../base

patches:
  - path: patches/scale-to-one.yaml
  - path: patches/disable-hpa.yaml
  - path: patches/ingress-contabo.yaml
  - path: patches/recreate-strategy.yaml

images:
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/frontend
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/backend
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/auth-service
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/gateway
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/search-service
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/notification-service
    newTag: latest
