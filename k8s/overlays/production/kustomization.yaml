apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - ../../base

patches:
  # Scale up for production traffic.
  - path: patches/prod-replicas.yaml
  # Replace StatefulSets with ExternalName Services pointing to managed cloud services.
  # Comment this out if you're running your own postgres/redis/rabbitmq in prod.
  - path: patches/external-services.yaml
  # Production Ingress host and TLS.
  - path: patches/ingress-prod.yaml

# CI sets these via: kustomize edit set image ghcr.io/...=sha-<commit>
images:
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/backend
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/auth-service
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/gateway
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/search-service
    newTag: latest
  - name: ghcr.io/shubhamshekhar23/ecommerce-monorepo/notification-service
    newTag: latest
