name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  # Mutation testing runs weekly — too slow for per-PR. Reveals tests that pass
  # but assert on nothing (survivors expose gaps in the test suite).
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Detect changed services ───────────────────────────────────────────
  # dorny/paths-filter outputs a boolean per service so downstream jobs only
  # run (or build) what actually changed. shared-types changes rebuild everything.
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      gateway: ${{ steps.filter.outputs.gateway }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      search-service: ${{ steps.filter.outputs.search-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any-service: ${{ steps.filter.outputs.any-service }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared-types/**'
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/shared-types/**'
            gateway:
              - 'apps/gateway/**'
              - 'packages/shared-types/**'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/shared-types/**'
            search-service:
              - 'apps/search-service/**'
              - 'packages/shared-types/**'
            frontend:
              - 'apps/frontend/**'
            any-service:
              - 'apps/**'
              - 'packages/**'
              - 'k8s/**'

  # ── Job 2: Lint + Type Check (backend) ───────────────────────────────────────
  # Fastest job — runs in parallel with test. Catches code quality issues immediately.
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - name: Build shared-types
        run: npm run build --workspace=@ecommerce/shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run lint:check

      - run: npm run format:check

      - run: npm run type-check

  # ── Job 3: Migration Safety ───────────────────────────────────────────────────
  # WHY this job exists:
  # Zero-downtime deploys require backward-compatible migrations.
  # The deploy sequence is: migrate → start new containers → switch traffic → stop old.
  # During the window between migrate and traffic switch, the OLD app version is still live.
  # If the migration drops a column the old app reads → crash on every request.
  #
  # The Expand/Contract pattern solves this:
  #   Release N:   ADD COLUMN new_col (nullable) — old code ignores it
  #   Release N+1: backfill, make NOT NULL if needed
  #   Release N+2: DROP COLUMN old_col — old code is gone by now
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migrations
        run: bash apps/backend/scripts/migration-safety-check.sh

  # ── Job 4: Tests ──────────────────────────────────────────────────────────────
  # Uses REAL Postgres + Redis — no mocks.
  # Why no mocks? Mock DB tests pass when the real query would fail due to:
  #   - Missing index causing timeout under load
  #   - Type mismatch between TypeScript model and actual column type
  #   - Constraint violation that the mock doesn't enforce
  # The cost of spinning up Postgres in CI (~15s) is worth the accuracy.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - name: Build shared-types
        run: npm run build --workspace=@ecommerce/shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      # Use "migrate deploy" (not "migrate dev") in CI.
      # "migrate dev" creates a shadow DB to detect schema drift — useful locally, overkill in CI.
      # "migrate deploy" applies pending migrations and nothing else. Faster, no shadow DB needed.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: npx prisma migrate deploy

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-chars-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-for-ci
          JWT_PRIVATE_KEY: ""
          JWT_PUBLIC_KEY: ""
          NODE_ENV: test
        run: npm run test -- --passWithNoTests --forceExit --coverage

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/backend/coverage/coverage-final.json
          fail_ci_if_error: false

  # ── Job 5: Build & Push (matrix over changed services) ───────────────────────
  # Only runs on push (not PRs) — PRs verify the code is correct, pushes ship it.
  # Builds only the services that changed, not the entire monorepo every time.
  #
  # Layer cache strategy (type=gha, mode=max):
  #   Cold build: ~3-5 min per service. Cache hit: ~30s (only changed layers rebuild).
  #   mode=max caches ALL intermediate layers including the deps stage — deps is the
  #   slowest layer (npm ci + native compilation). On cache hit it's skipped entirely.
  #   Cache key is scoped per service so one service's cache never pollutes another.
  build:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-typecheck, migration-safety, test, detect-changes]
    # lint-typecheck, migration-safety, test all use `if` conditions so they may be
    # skipped. `always()` here lets build run even when those jobs were skipped.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.any-service == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            changed: ${{ needs.detect-changes.outputs.backend }}
            dockerfile: apps/backend/Dockerfile
            image: backend
            build_args: ""
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
            dockerfile: apps/auth-service/Dockerfile
            image: auth-service
            build_args: ""
          - service: gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
            dockerfile: apps/gateway/Dockerfile
            image: gateway
            build_args: ""
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
            dockerfile: apps/notification-service/Dockerfile
            image: notification-service
            build_args: ""
          - service: search-service
            changed: ${{ needs.detect-changes.outputs.search-service }}
            dockerfile: apps/search-service/Dockerfile
            image: search-service
            build_args: ""
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            dockerfile: apps/frontend/Dockerfile
            image: frontend
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
              NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Skip unchanged service
        if: matrix.changed != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changes in ${{ matrix.service }} — skipping build."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - uses: docker/login-action@v3
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Job 5b: Pact Consumer → Provider Contract Tests ──────────────────────────
  # Two-step: consumer test (frontend) generates the pact file, then the provider
  # (backend) verifies it satisfies every recorded interaction.
  # Testcontainers spins up isolated PostgreSQL + Redis — no services block needed.
  # The committed pacts/frontend-backend.json is the source of truth; the consumer
  # step confirms it hasn't drifted from what the frontend actually expects.
  pact:
    name: Pact Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.any-service == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - name: Build shared-types
        run: npm run build --workspace=@ecommerce/shared-types

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Consumer contract test — generate pact file
        working-directory: apps/frontend
        run: npm run test:pact

      - name: Provider verification — backend satisfies consumer expectations
        working-directory: apps/backend
        env:
          NODE_ENV: test
          JWT_PRIVATE_KEY: ''
          STRIPE_SECRET_KEY: sk_test_placeholder
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          KAFKA_BROKERS: localhost:9092
          SEARCH_GRPC_URL: localhost:5005
        run: npm run test:pact

  # ── Jobs 6a–6c: Frontend CI ──────────────────────────────────────────────────
  # Three-stage pipeline that only runs when apps/frontend/** changes.
  # Stage 1 (lint + typecheck) runs first — fastest feedback, no install of
  # Playwright browsers needed.
  # Stage 2 (unit tests) needs stage 1 to pass — runs Jest with coverage gate.
  # Stage 3 (build) needs stage 2 to pass — `next build` validates that TSC
  # errors, missing env vars, and bad imports don't sneak past the type-checker.
  frontend-lint-typecheck:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint (zero warnings)
        run: npm run lint:check

      - name: Stylelint
        run: npx stylelint "src/**/*.scss" --max-warnings=0

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,scss}"

      - name: Dependency audit
        run: npm audit --audit-level=critical
        working-directory: .

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, frontend-lint-typecheck]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, frontend-test]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Bundle size check
        run: npm run check:bundle

  # ── Job 6d: Frontend E2E Tests ───────────────────────────────────────────────
  # Runs after the production build so the server started by webServer config
  # is `next start` (not `next dev`) — closer to production behaviour.
  # Only chromium in CI: cross-browser coverage is handled locally.
  # Visual regression tests are excluded — they compare against OS-specific PNG
  # baselines; macOS baselines are committed but linux ones are not yet. Once
  # linux baselines are captured and committed, remove --grep-invert.
  frontend-e2e:
    name: Frontend — E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, frontend-build]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run E2E tests
        run: npx playwright test --project=chromium --grep-invert "Visual regression"
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # ── Job 6e: Frontend Lighthouse CI ───────────────────────────────────────────
  # Runs Lighthouse against a production Next.js server built in this job.
  # Thresholds: Performance ≥80, Accessibility ≥90, SEO ≥90.
  # Best-practices is warned (not errored) because localhost HTTP reduces that
  # category's score by design.
  frontend-lighthouse:
    name: Frontend — Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, frontend-build]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./apps/frontend/lighthouserc.json
          serverCommand: 'cd apps/frontend && npx next start -p 3000'
          urls: |
            http://localhost:3000/
            http://localhost:3000/en/products
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── Job 7: Mutation Testing (weekly only) ────────────────────────────────────
  # Stryker mutates operators/conditions in orders/** and products/** then re-runs
  # unit tests to see if the mutation is caught (killed) or slips through (survived).
  # Too slow for per-PR (~5–15 min per module) — scheduled weekly on Monday 03:00 UTC.
  # A survivor means a test passes even when the code is intentionally broken,
  # which reveals assertions that check nothing meaningful.
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only on scheduled runs and manual dispatch — not on push/PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - name: Build shared-types
        run: npm run build --workspace=@ecommerce/shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run mutation tests
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          REDIS_URL: 'redis://localhost:6379'
          JWT_PUBLIC_KEY: ''
          STRIPE_SECRET_KEY: 'sk_test_placeholder'
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/backend/reports/mutation/mutation.html
          retention-days: 30

  # ── Job 7b: Apply cluster secrets ────────────────────────────────────────────
  # Runs on every push to main — idempotent (dry-run + apply pattern).
  # Secret VALUES live only in GitHub repo Secrets, never in git.
  # Non-sensitive config (usernames, hosts) is inlined here — safe to commit.
  # JWT keys are read from private.pem / public.pem already in the repo.
  apply-secrets:
    name: Apply cluster secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTABO }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply secrets
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          PG_USER="ecommerce"
          PG_DB="ecommerce"
          RABBITMQ_USER="ecommerce"
          VPS_IP="185.214.134.81"
          SMTP_HOST="smtp.mailtrap.io"
          SMTP_PORT="587"
          SMTP_FROM="noreply@ecommerce.local"

          DATABASE_URL="postgresql://${PG_USER}:${PG_PASSWORD}@pgbouncer:6432/${PG_DB}?pgbouncer=true"
          DIRECT_DATABASE_URL="postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}"
          REDIS_URL="redis://redis:6379"
          RABBITMQ_URL="amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672"

          KN="kubectl -n ecommerce"

          $KN create secret generic postgres-secrets \
            --from-literal=POSTGRES_USER="$PG_USER" \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --from-literal=POSTGRES_DB="$PG_DB" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic rabbitmq-secrets \
            --from-literal=RABBITMQ_DEFAULT_USER="$RABBITMQ_USER" \
            --from-literal=RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASS" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic backend-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=DIRECT_DATABASE_URL="$DIRECT_DATABASE_URL" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL" \
            --from-literal=JWT_PRIVATE_KEY="$(cat private.pem)" \
            --from-literal=JWT_PUBLIC_KEY="$(cat public.pem)" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_PORT="$SMTP_PORT" \
            --from-literal=SMTP_USER="${SMTP_USER:-placeholder}" \
            --from-literal=SMTP_PASSWORD="${SMTP_PASS:-placeholder}" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=CORS_ORIGIN="http://${VPS_IP}" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic auth-secrets \
            --from-literal=DATABASE_URL="$DIRECT_DATABASE_URL" \
            --from-literal=DIRECT_DATABASE_URL="$DIRECT_DATABASE_URL" \
            --from-literal=JWT_PRIVATE_KEY="$(cat private.pem)" \
            --from-literal=JWT_PUBLIC_KEY="$(cat public.pem)" \
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic gateway-secrets \
            --from-literal=JWT_PUBLIC_KEY="$(cat public.pem)" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic search-secrets \
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic notification-secrets \
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_PORT="$SMTP_PORT" \
            --from-literal=SMTP_USER="${SMTP_USER:-placeholder}" \
            --from-literal=SMTP_PASSWORD="${SMTP_PASS:-placeholder}" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=APP_URL="http://${VPS_IP}" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

          $KN create secret generic grafana-secrets \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD:-admin}" \
            --save-config --dry-run=client -o yaml | $KN apply -f -

  # ── Job 8: Apply k8s manifests ───────────────────────────────────────────────
  # Runs on every push to main (or workflow_dispatch) to apply k8s YAML changes.
  # Handles infra-only changes (new services, network policies, configmaps, etc.)
  # that don't involve a Docker image rebuild.
  apply-manifests:
    name: Apply k8s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTABO }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/contabo

  # ── Job 9: Deploy to Contabo ─────────────────────────────────────────────────
  # Runs after build succeeds. Only triggers on push to main (not PRs, not develop).
  # Restarts only the deployments whose images were just rebuilt — not the whole cluster.
  # kubectl rollout status blocks until the new pod is healthy or times out (5 min).
  deploy:
    name: Deploy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, detect-changes]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            changed: ${{ needs.detect-changes.outputs.backend }}
            deployment: backend
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
            deployment: auth-service
          - service: gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
            deployment: gateway
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
            deployment: notification-service
          - service: search-service
            changed: ${{ needs.detect-changes.outputs.search-service }}
            deployment: search-service
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            deployment: frontend

    steps:
      - name: Skip unchanged service
        if: matrix.changed != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changes in ${{ matrix.service }} — skipping deploy."

      - name: Set up kubeconfig
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTABO }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollout restart
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl rollout restart deployment/${{ matrix.deployment }} -n ecommerce
          kubectl rollout status deployment/${{ matrix.deployment }} -n ecommerce --timeout=600s
