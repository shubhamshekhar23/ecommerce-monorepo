# Full stack — infrastructure + all application services.
# Backend runs in dev mode (hot reload via volume mount). Other services build from Dockerfiles.
# Build context is always the monorepo root so all Dockerfiles can access shared packages.
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d postgres redis rabbitmq pgbouncer  # infra only
#   docker compose logs -f backend    # tail backend logs
#   docker compose down               # stop everything
#   docker compose down -v            # stop and delete all data volumes
#
# Read replica (optional, Phase 10):
#   docker compose -f docker-compose.yml -f docker-compose.replica.yml up -d

name: ecommerce

# ── Shared env fragments ──────────────────────────────────────────────────────
# YAML anchors — define once, merge into multiple services with <<:
x-db-env: &db-env
  DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@pgbouncer:6432/ecommerce_db?pgbouncer=true&connection_limit=1
  DIRECT_DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

x-jwt-env: &jwt-env
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

services:

  # ════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    # pg_stat_statements: tracks cumulative query execution stats (Phase 10 — slow query analysis).
    # Must be in shared_preload_libraries at startup — cannot be loaded via SQL after boot.
    # wal_level=replica + max_wal_senders: required for streaming replication (docker-compose.replica.yml).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - '5434:5432'  # exposed for direct access: psql, Prisma Studio, migrations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce_user']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── PgBouncer ───────────────────────────────────────────────────────────────
  # Sits in front of Postgres and multiplexes app connections into a small pool
  # of real Postgres server connections. App connects here (:6432), not Postgres directly.
  #
  # TRANSACTION mode: server connection returned to pool after each transaction.
  # Required for Prisma — prepared statements are session-scoped and break in this mode,
  # so Prisma URLs must include ?pgbouncer=true to disable them.
  #
  # Watch pooling in action during load test:
  #   docker exec ecommerce_postgres psql -U ecommerce_user -c "SELECT count(*) FROM pg_stat_activity"
  # You will see ~20 connections regardless of how many app requests are in flight.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce_pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_db
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: plain
      LISTEN_PORT: 6432
      STATS_USERS: ecommerce_user
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── PgBouncer Exporter ───────────────────────────────────────────────────────
  # Connects to PgBouncer's admin database (virtual "pgbouncer" db) and exposes
  # pool stats as Prometheus metrics. Scraped by Prometheus at :9127/metrics.
  # Key metrics: client_active, client_waiting, server_idle, total_requests.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.7.0
    container_name: ecommerce_pgbouncer_exporter
    command:
      - --pgBouncer.connectionString=postgresql://ecommerce_user:ecommerce_password@pgbouncer:6432/pgbouncer?sslmode=disable
    ports:
      - '9127:9127'
    depends_on:
      - pgbouncer
    networks:
      - ecommerce-network

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ecommerce_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'  # management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  # ── OpenSearch ──────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ecommerce_opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Relax disk watermarks — Docker Desktop VM disk can appear "full" even with
      # plenty of macOS host space. Prevents OpenSearch going read-only on dev machines.
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99.5%
      - cluster.routing.allocation.disk.watermark.flood_stage=99.9%
    ports:
      - '9200:9200'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health | grep -q "\"status\":\"green\"\|\"status\":\"yellow\""']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-network

  # ── Mailpit ─────────────────────────────────────────────────────────────────
  # Catches all outgoing SMTP — never actually sends emails. View at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_mailpit
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # web UI
    networks:
      - ecommerce-network

  # ── Jaeger ──────────────────────────────────────────────────────────────────
  # Distributed tracing. The NestJS app sends OTLP spans here via OpenTelemetry.
  # Open http://localhost:16686 to see request waterfalls: HTTP → service → Prisma → Redis.
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: ecommerce_jaeger
    user: root
    command: ["--config=/etc/jaeger/jaeger.yml"]
    volumes:
      - ./apps/backend/jaeger.yml:/etc/jaeger/jaeger.yml:ro
      - jaeger_data:/badger
    ports:
      - '16686:16686'  # Jaeger UI
      - '4318:4318'    # OTLP HTTP receiver (app sends traces here)
      - '4317:4317'    # OTLP gRPC receiver
    networks:
      - ecommerce-network

  # ── PgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./apps/backend/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./apps/backend/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    networks:
      - ecommerce-network

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./apps/backend/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./apps/backend/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - ecommerce-network

  # ── Loki ─────────────────────────────────────────────────────────────────────
  # Log aggregation backend. Stores and indexes logs shipped by Promtail.
  # Query logs in Grafana: select "Loki" datasource, filter by {service="backend"}.
  loki:
    image: grafana/loki:3.0.0
    container_name: ecommerce_loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./apps/backend/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - ecommerce-network

  # ── Promtail ──────────────────────────────────────────────────────────────
  # Log collector. Tails every container's stdout/stderr via Docker socket
  # and ships log lines to Loki. No app code changes needed — it discovers
  # containers automatically and labels logs by service name.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ecommerce_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./apps/backend/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - ecommerce-network

  # ════════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ════════════════════════════════════════════════════════════════════════════

  # ── Backend (NestJS) ────────────────────────────────────────────────────────
  # Runs in dev mode: source code is mounted, hot reload active.
  # Uses the deps Dockerfile stage so devDependencies (@nestjs/cli) are available.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: deps
    container_name: ecommerce_backend
    environment:
      <<: [*db-env, *rabbitmq-env, *jwt-env]
      NODE_ENV: development
      PORT: 4000
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost,http://localhost:3000,http://localhost:3001,http://localhost:3002
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: dev-secret-key-min-32-chars-do-not-use-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-key-min-32-chars-do-not-use-in-production
      BUG_SCENARIO: ${BUG_SCENARIO:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
    working_dir: /app/apps/backend
    command: npm run start:dev
    ports:
      - '4000:4000'  # direct access (bypasses gateway) — useful for debugging
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - ecommerce-network

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: ecommerce_auth
    environment:
      <<: [*db-env, *rabbitmq-env, *jwt-env]
      PORT: 3006
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Auth service connects to Postgres directly (not PgBouncer) — it uses
      # session-level features incompatible with transaction pooling mode.
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── Search Service ───────────────────────────────────────────────────────────
  search-service:
    build:
      context: .
      dockerfile: apps/search-service/Dockerfile
    container_name: ecommerce_search
    environment:
      <<: *rabbitmq-env
      PORT: 3005
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: ecommerce_notification
    environment:
      <<: *rabbitmq-env
      PORT: 3004
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BUG_SCENARIO: ${BUG_SCENARIO:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - ecommerce-network

  # ── Gateway ──────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: ecommerce_gateway
    environment:
      <<: *jwt-env
      PORT: 3000
      BACKEND_URL: http://backend:4000
      AUTH_SERVICE_URL: http://auth-service:3006
      SEARCH_SERVICE_URL: http://search-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    ports:
      - '3000:3000'
    depends_on:
      - backend
      - auth-service
      - search-service
      - notification-service
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  jaeger_data:
  # node_modules volumes: named so "docker compose down -v" removes them cleanly.
  # After any package.json change: docker compose build backend && docker compose up -d backend
  node_modules:
  backend_node_modules:

networks:
  ecommerce-network:
    driver: bridge
