# Local development infrastructure — runs only the backing services (DB, cache, broker).
# App services run as bare Node processes (npm run start:dev) for faster hot-reload.
#
# Usage:
#   npm run dev:infra          # start all infra
#   docker compose -f docker-compose.dev.yml up rabbitmq -d   # just the broker
#
# RabbitMQ management UI: http://localhost:15672  (guest/guest)
# Mailpit UI (catch all emails): http://localhost:8025
# OpenSearch REST API: http://localhost:9200

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_db_dev
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_dev
    command: redis-server --requirepass devpassword
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ecommerce_rabbitmq_dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'    # AMQP
      - '15672:15672'  # Management UI
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — catches all outgoing emails during local dev.
  # No emails actually sent. View them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_mailpit_dev
    ports:
      - '1025:1025'  # SMTP — point SMTP_HOST=localhost SMTP_PORT=1025
      - '8025:8025'  # Web UI

  # OpenSearch — single-node, security disabled for local dev.
  # Production uses a proper cluster with TLS; dev just needs the REST API.
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ecommerce_opensearch_dev
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Relax disk watermarks — Docker Desktop VM disk can appear "full" even with
      # plenty of macOS host space. Prevents read-only block on dev data.
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99.5%
      - cluster.routing.allocation.disk.watermark.flood_stage=99.9%
    ports:
      - '9200:9200'
    volumes:
      - opensearch_dev_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "\"status\":\"green\"\|\"status\":\"yellow\""']
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
  opensearch_dev_data:
